# a2moto model whitelist.
#
# All spec figures (kW, hp, cc, wet weight) are RECALLED from public spec
# sheets and are UNVERIFIED (verified: false) until checked against a
# manufacturer data sheet. The `source` field records provenance. Do not
# treat unverified figures as authoritative -- tests/test_models_yaml.py
# lists every unverified entry for audit.
#
# Aliases are case-insensitive regexes matched against listing titles in
# CZ/SK/PL. Extend from data/unmatched.txt as real titles come in.
#
# Note: SPEC.md lists "SV650 (restricted)" and "Trident 660 (restricted)"
# under native A2 as well; each model appears here exactly once with
# restrictable: true. Already-restricted examples are handled per-listing
# via is_restricted_35kw.

models:
