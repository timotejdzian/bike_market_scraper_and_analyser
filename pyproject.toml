[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2moto"
version = "0.1.0"
description = "A2 sportbike market scraper and fair-price analyzer for CZ/SK/PL classifieds"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0.1",
    "structlog>=24.1",
    "pdfplumber>=0.11",
    "pyarrow>=16",
]

[project.optional-dependencies]
js = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
a2moto = "a2moto.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["a2moto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
